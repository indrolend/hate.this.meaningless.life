<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CommandHUD — Repository Map</title>
<style>
:root{color-scheme:dark;--bg:#111313;--panel:#181b1b;--line:#3b4242;--text:#eeeae1;--muted:#91a0a0;--cyan:#78d5e1;--lime:#d4ec8e;--gold:#e1b87f;--tree:230px}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-columns:var(--tree) 1fr;grid-template-rows:44px 1fr 28px 64px;transition:grid-template-columns .18s}.app.tree-closed{--tree:0px}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:#151818;z-index:8}.icon{width:30px;height:30px;border:0;background:transparent;border-radius:4px;cursor:pointer}.icon:hover{background:#2a2f2f}.brand{font-size:13px;font-weight:750}.branch,.hint{color:var(--muted);font:11px ui-monospace,Consolas,monospace}.spacer{flex:1}
.tree{grid-row:2/4;border-right:1px solid var(--line);background:#151818;overflow:hidden;z-index:7}.tree-inner{width:230px;height:100%;display:flex;flex-direction:column}.tree-head{height:38px;padding:13px 12px;border-bottom:1px solid #2b3030;font-size:10px;font-weight:800;letter-spacing:.1em}.tree-scroll{padding:8px 6px;overflow:auto}.tree-row{width:100%;height:28px;display:flex;align-items:center;gap:7px;padding:0 8px;border:0;border-radius:4px;background:transparent;text-align:left;font-size:12px;cursor:pointer}.tree-row:hover,.tree-row.selected{background:#293030}.tree-row[data-depth="1"]{padding-left:25px}.twisty{width:10px;color:var(--muted)}.folder-dot{width:9px;height:7px;border:1px solid var(--gold)}.file-dot{width:7px;height:7px;border-radius:2px;background:var(--muted)}.changed{margin-left:auto;color:var(--gold);font:10px ui-monospace}
.viewport{grid-column:2;grid-row:2;position:relative;overflow:hidden;background:#131616;touch-action:none;cursor:grab}.viewport.dragging{cursor:grabbing}.world{position:absolute;width:1180px;height:720px;transform-origin:0 0}.world:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#fff06 1px,transparent 1px),linear-gradient(90deg,#fff06 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(circle,black,transparent 82%)}.region{position:absolute;border:1px solid #3a4242;background:#171a1acc;border-radius:10px}.region-title{position:absolute;top:10px;left:14px;color:#aeb8b5;font-size:11px;font-weight:800}.region-meta{position:absolute;top:11px;right:12px;color:#687575;font:9px ui-monospace}
.node{position:absolute;width:132px;min-height:56px;padding:9px 10px;border:1px solid #414949;border-radius:6px;background:#202424;box-shadow:0 3px 8px #0004;text-align:left;cursor:pointer}.node:hover{border-color:#728080;background:#252a2a}.node.selected{border-color:var(--cyan);box-shadow:0 0 0 2px #78d5e124}.node.active{animation:pulse 1.25s ease 2}.node-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 11px ui-monospace,Consolas,monospace}.node-kind{display:block;margin-top:7px;color:var(--muted);font-size:10px}.mark{position:absolute;right:8px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--gold)}@keyframes pulse{50%{border-color:var(--lime);box-shadow:0 0 0 5px #d4ec8e1d;background:#29302a}}
.zoom{position:absolute;right:14px;top:14px;display:flex;background:#171a1a;border:1px solid var(--line);border-radius:5px;overflow:hidden}.zoom button{width:30px;height:28px;border:0;border-right:1px solid var(--line);background:transparent;cursor:pointer}.map-help{position:absolute;right:14px;bottom:13px;padding:6px 8px;border-radius:4px;background:#111c;color:var(--muted);font-size:10px}
.focus{position:absolute;left:50%;top:50%;width:min(620px,calc(100% - 60px));max-height:calc(100% - 70px);transform:translate(-50%,-50%) scale(.97);padding:18px;border:1px solid #687474;border-radius:8px;background:#1c2020f7;box-shadow:0 18px 60px #000a;opacity:0;pointer-events:none;transition:.14s;overflow:auto}.focus.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}.focus-head{display:flex}.focus-title{margin:0;font:750 19px ui-monospace}.focus-path{margin-top:4px;color:var(--muted);font:11px ui-monospace}.focus-close{margin-left:auto;width:30px;height:30px;border:1px solid var(--line);border-radius:4px;background:transparent;cursor:pointer}.focus-summary{margin:20px 0;color:#c5cdca;font-size:13px;line-height:1.55}.focus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fact{padding:10px;border:1px solid #343b3b;border-radius:5px;background:#171a1a}.fact-label{color:var(--muted);font-size:9px;text-transform:uppercase}.fact-value{margin-top:5px;font:700 12px ui-monospace}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.soft{height:32px;padding:0 11px;border:1px solid #4c5757;border-radius:4px;background:#252a2a;font-size:11px;cursor:pointer}
.status{grid-column:2;grid-row:3;display:flex;align-items:center;gap:16px;padding:0 12px;border-top:1px solid var(--line);background:#171a1a;color:var(--muted);font:10px ui-monospace}.status strong{color:var(--text)}.good{color:var(--lime)!important}.warn{color:var(--gold)!important}.terminal{grid-column:1/-1;grid-row:4;position:relative;display:flex;align-items:center;gap:9px;padding:10px 12px;border-top:1px solid var(--line);background:#101212;z-index:10}.prompt{color:var(--lime);font:800 14px ui-monospace}.terminal>input{min-width:0;flex:1;height:38px;padding:0 10px;border:1px solid #3d4646;border-radius:4px;outline:0;background:#171a1a;color:var(--text);font:13px ui-monospace}.run,.toolkit-button{height:38px;padding:0 14px;border:1px solid #596464;border-radius:4px;background:#252b2b;cursor:pointer;font-size:11px}.toolkit-button[aria-expanded=true]{border-color:var(--cyan)}
.picker{position:absolute;left:12px;bottom:58px;width:min(520px,calc(100vw - 24px));height:0;display:grid;grid-template-columns:155px 1fr;border:1px solid #566262;border-radius:7px;background:#1b1f1f;box-shadow:0 16px 48px #000b;opacity:0;overflow:hidden;pointer-events:none;transition:height .18s,opacity .14s}.picker.open{height:310px;opacity:1;pointer-events:auto}.categories{padding:8px;border-right:1px solid var(--line)}.category{width:100%;height:34px;padding:0 10px;border:0;border-radius:4px;background:transparent;text-align:left;font-size:12px;cursor:pointer}.category:hover,.category.selected{background:#303636}.picker-main{display:flex;min-width:0;flex-direction:column}.picker-search{margin:10px;height:34px;padding:0 10px;border:1px solid #3d4646;border-radius:4px;background:#131616;color:var(--text);outline:0}.picker-list{padding:0 8px 8px;overflow:auto}.command-item{width:100%;display:grid;grid-template-columns:1fr auto;gap:6px;padding:9px 10px;border:0;border-radius:5px;background:transparent;text-align:left;cursor:pointer}.command-item:hover{background:#2a3030}.command-name{font-size:12px;font-weight:700}.command-desc{grid-column:1;color:var(--muted);font-size:10px}.command-code{grid-column:1/-1;color:#b8c6c3;font:10px ui-monospace}.scope{padding:2px 5px;border-radius:3px;background:#343b3b;color:var(--muted);font-size:9px}
.output{position:absolute;right:12px;bottom:58px;width:min(600px,calc(100vw - 24px));max-height:280px;border:1px solid #505b5b;border-radius:7px;background:#171a1af5;box-shadow:0 15px 45px #000b;overflow:hidden;opacity:0;transform:translateY(8px);pointer-events:none;transition:.14s}.output.open{opacity:1;transform:none;pointer-events:auto}.output-head{height:34px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--line);font-size:11px}.output-head button{margin-left:auto;border:0;background:transparent;cursor:pointer}.output pre{max-height:245px;margin:0;padding:12px;overflow:auto;color:#c7d2cf;font:11px/1.55 ui-monospace;white-space:pre-wrap}
</style></head><body><main class="app" id="app">
<header><button class="icon" id="treeToggle" aria-label="Toggle file tree" aria-expanded="true">☰</button><span class="brand">digital-breakdown-apk</span><span class="branch">agent/playground-physical-traversal</span><span class="spacer"></span><span class="hint">Map view · drag to move · wheel to zoom</span></header>
<aside class="tree"><div class="tree-inner"><div class="tree-head">EXPLORER</div><div class="tree-scroll" id="treeList"></div></div></aside>
<section class="viewport" id="viewport" aria-label="Repository map"><div class="world" id="world"></div><div class="zoom"><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomReset" aria-label="Reset map view">⌂</button><button id="zoomIn" aria-label="Zoom in">+</button></div><div class="map-help">Drag to move · wheel to zoom · select a file to focus</div>
<article class="focus" id="focusPanel" aria-hidden="true"><div class="focus-head"><div><h2 class="focus-title" id="focusTitle"></h2><div class="focus-path" id="focusPath"></div></div><button class="focus-close" id="focusClose" aria-label="Collapse focused file">×</button></div><p class="focus-summary" id="focusSummary"></p><div class="focus-grid" id="focusFacts"></div><div class="actions"><button class="soft" data-action="test">Test this</button><button class="soft" data-action="deps">Show dependencies</button><button class="soft" data-action="changes">Changes here</button><button class="soft" data-action="open">Open in editor</button></div></article></section>
<div class="status"><span>branch <strong>agent/playground-physical-traversal</strong></span><span>selection <strong id="selection">repository</strong></span><span>process <strong id="process" class="good">idle</strong></span><span>changes <strong class="warn">1</strong></span><span>tests <strong class="good">22 pass</strong></span></div>
<form class="terminal" id="terminal"><button type="button" class="toolkit-button" id="toolkitButton" aria-expanded="false">▦ Toolkit</button><span class="prompt">$</span><input id="commandInput" aria-label="Terminal command" autocomplete="off" placeholder="Enter a command, or open Toolkit"><button class="run">Run</button>
<section class="picker" id="picker"><nav class="categories" id="categories"></nav><div class="picker-main"><input class="picker-search" id="pickerSearch" aria-label="Search toolkit" placeholder="Find an action…"><div class="picker-list" id="pickerList"></div></div></section>
<section class="output" id="output"><div class="output-head"><span id="outputTitle">Command output</span><button type="button" id="outputClose" aria-label="Close command output">×</button></div><pre id="outputText"></pre></section></form></main>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),app=$('#app'),viewport=$('#viewport'),world=$('#world'),treeList=$('#treeList'),focus=$('#focusPanel'),input=$('#commandInput'),picker=$('#picker'),toolkit=$('#toolkitButton'),output=$('#output');
const folders=[{id:'hud',name:'tools / hud',x:100,y:92,w:430,h:260,color:'#78d5e1',meta:'4 files'},{id:'game',name:'native / game',x:585,y:70,w:470,h:330,color:'#d4ec8e',meta:'engine'},{id:'network',name:'multiplayer / network',x:100,y:410,w:440,h:210,color:'#7773ce',meta:'services'},{id:'docs',name:'docs / scripts',x:600,y:450,w:410,h:180,color:'#e1b87f',meta:'support'}];
const files=[
{id:'cli',folder:'hud',name:'cli.mjs',path:'tools/hud/cli.mjs',x:24,y:58,kind:'command entry',summary:'Parses HUD commands and presents repository, workflow, and continuation state.',deps:'core.mjs',tests:'core contracts'},
{id:'core',folder:'hud',name:'core.mjs',path:'tools/hud/core.mjs',x:178,y:58,kind:'state engine',summary:'Derives compact, renderer-neutral state from repository evidence and immutable run records.',deps:'node:fs · node:path',tests:'22 contracts',changed:true},
{id:'hudtest',folder:'hud',name:'core.test.mjs',path:'tools/hud/core.test.mjs',x:24,y:140,kind:'contract tests',summary:'Verifies reducers, evidence currency, workflow state, and continuation behavior.',deps:'core.mjs',tests:'22 passing'},
{id:'visual',folder:'hud',name:'visual-prototype',path:'tools/hud/visual-prototype/index.html',x:178,y:140,kind:'visual client',summary:'Maps semantic HUD state into a navigable repository workspace.',deps:'hud-state.js',tests:'browser interaction'},
{id:'gamecpp',folder:'game',name:'Game.cpp',path:'native-android/app/src/main/cpp/game/Game.cpp',x:26,y:62,kind:'orchestration',summary:'Coordinates gameplay systems while shared modules own focused behavior.',deps:'Game.hpp · gameplay/*',tests:'gameplay parity'},
{id:'visualid',folder:'game',name:'VisualIdentity.hpp',path:'native-android/app/src/main/cpp/game/VisualIdentity.hpp',x:184,y:62,kind:'visual identity',summary:'Defines the canonical palette and visual constants used across the game.',deps:'Math.hpp',tests:'render smoke'},
{id:'renderer',folder:'game',name:'Renderer.cpp',path:'native-android/app/src/main/cpp/game/Renderer.cpp',x:26,y:145,kind:'renderer',summary:'Turns canonical simulation state into native game presentation.',deps:'VisualIdentity.hpp',tests:'visual parity'},
{id:'gameh',folder:'game',name:'Game.hpp',path:'native-android/app/src/main/cpp/game/Game.hpp',x:184,y:145,kind:'state contract',summary:'Declares pooled state and stable gameplay interfaces.',deps:'TargetState · Math',tests:'protocol layout'},

{id:'protocol',folder:'network',name:'Protocol.hpp',path:'native-network/Protocol.hpp',x:182,y:60,kind:'binary protocol',summary:'Defines versioned network messages and protocol-visible layouts.',deps:'fixed structs',tests:'protocol 7'},
{id:'readme',folder:'docs',name:'README.md',path:'README.md',x:25,y:55,kind:'project guide',summary:'Introduces the project, supported runtimes, and development entry points.',deps:'documentation',tests:'—'},
{id:'scripts',folder:'docs',name:'verify-gameplay.ps1',path:'scripts/verify-gameplay.ps1',x:180,y:55,kind:'verification',summary:'Runs the canonical focused gameplay validation suite.',deps:'PowerShell · Node',tests:'parity smoke'}];
const commands={'Context':[['Inspect selected file','Focus purpose, relationships, and status.','hud inspect {selection}','selection'],['Show dependencies','Reveal imports and consumers on the map.','hud deps {selection}','selection'],['Find file','Search the repository and fly to a result.','hud find ','repository']],'Test':[['Test selected file','Run the narrowest relevant verification.','npm test -- {selection}','selection'],['Test changed files','Verify work changed since HEAD.','npm test -- --changedSince=HEAD','worktree'],['HUD contract suite','Run all semantic HUD contracts.','npm run hud:test','tools/hud']],'Git':[['Review changes','Show the current worktree patch.','git diff -- {selection}','selection'],['Repository status','Show branch and concise worktree state.','git status --short --branch','repository'],['Recent commits','Show recent checkpoints.','git log -8 --oneline --decorate','repository']],'Run & Build':[['Build desktop game','Compile the Windows release target.','cmake --build build/windows-release --config Release --parallel','desktop'],['Gameplay verification','Run the canonical focused parity suite.','powershell -ExecutionPolicy Bypass -File ./scripts/verify-gameplay.ps1','game']],'Library':[['HUD state','Load real repository state.','real','CommandHUD'],['Workflow status','Inspect the active workflow.','node tools/hud/cli.mjs workflow hud-integrated-1','CommandHUD']]};
let camera={x:40,y:30,z:.86},drag=null,selected=null,openFolders=new Set(folders.map(f=>f.id)),category='Context';
function applyCamera(){world.style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.z})`}
function renderWorld(){world.innerHTML='';folders.forEach(folder=>{const r=document.createElement('section');r.className='region';r.style.cssText=`left:${folder.x}px;top:${folder.y}px;width:${folder.w}px;height:${folder.h}px;border-top-color:${folder.color}`;r.innerHTML=`<span class="region-title">${folder.name}</span><span class="region-meta">${folder.meta}</span>`;files.filter(f=>f.folder===folder.id).forEach(f=>{const b=document.createElement('button');b.className='node'+(selected?.id===f.id?' selected':'');b.dataset.file=f.id;b.style.cssText=`left:${f.x}px;top:${f.y}px`;b.innerHTML=`<span class="node-name">${f.name}</span><span class="node-kind">${f.kind}</span>${f.changed?'<span class="mark"></span>':''}`;r.appendChild(b)});world.appendChild(r)});applyCamera()}
function renderTree(){treeList.innerHTML='';folders.forEach(f=>{const r=document.createElement('button');r.className='tree-row';r.dataset.folder=f.id;r.innerHTML=`<span class="twisty">${openFolders.has(f.id)?'▾':'▸'}</span><span class="folder-dot"></span><span>${f.name}</span>`;treeList.appendChild(r);if(openFolders.has(f.id))files.filter(x=>x.folder===f.id).forEach(x=>{const i=document.createElement('button');i.className='tree-row'+(selected?.id===x.id?' selected':'');i.dataset.file=x.id;i.dataset.depth=1;i.innerHTML=`<span class="twisty"></span><span class="file-dot"></span><span>${x.name}</span>${x.changed?'<span class="changed">M</span>':''}`;treeList.appendChild(i)})})}
function setZoom(z,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2){const old=camera.z,next=Math.max(.52,Math.min(1.55,z));camera.x=cx-(cx-camera.x)*(next/old);camera.y=cy-(cy-camera.y)*(next/old);camera.z=next;applyCamera()}
function selectFile(id,fly=false){selected=files.find(f=>f.id===id);if(!selected)return;renderTree();renderWorld();$('#selection').textContent=selected.name;if(fly){const f=folders.find(x=>x.id===selected.folder);camera.z=1.08;camera.x=viewport.clientWidth/2-(f.x+selected.x+66)*camera.z;camera.y=viewport.clientHeight/2-(f.y+selected.y+30)*camera.z;applyCamera()}$('#focusTitle').textContent=selected.name;$('#focusPath').textContent=selected.path;$('#focusSummary').textContent=selected.summary;$('#focusFacts').innerHTML=`<div class="fact"><div class="fact-label">Role</div><div class="fact-value">${selected.kind}</div></div><div class="fact"><div class="fact-label">Relationships</div><div class="fact-value">${selected.deps}</div></div><div class="fact"><div class="fact-label">Verification</div><div class="fact-value">${selected.tests}</div></div>`;focus.classList.add('open');focus.setAttribute('aria-hidden','false')}
function closeFocus(){focus.classList.remove('open');focus.setAttribute('aria-hidden','true')}function resolved(c){return c.replaceAll('{selection}',selected?.path||'[select a file]')}function filtered(){const q=$('#pickerSearch').value.toLowerCase();return commands[category].filter(a=>a.join(' ').toLowerCase().includes(q))}
function togglePicker(force){const open=force??!picker.classList.contains('open');picker.classList.toggle('open',open);toolkit.setAttribute('aria-expanded',open);if(open){renderPicker();setTimeout(()=>$('#pickerSearch').focus(),20)}else input.focus()}
function renderPicker(){$('#categories').innerHTML=Object.keys(commands).map(c=>`<button type="button" class="category${c===category?' selected':''}" data-category="${c}">${c}</button>`).join('');$('#pickerList').innerHTML=filtered().map((a,i)=>`<button type="button" class="command-item" data-command="${i}"><span class="command-name">${a[0]}</span><span class="scope">${a[3]}</span><span class="command-desc">${a[1]}</span><span class="command-code">${resolved(a[2])}</span></button>`).join('')}
function run(command){command=command.trim();if(!command)return;$('#process').textContent='running';$('#process').className='warn';output.classList.add('open');$('#outputTitle').textContent=command;$('#outputText').textContent=`$ ${command}\n\nStarting…`;const ids=command.includes('hud:test')?['cli','core','hudtest','visual']:command.includes('test')&&selected?[selected.id]:command.includes('git')?['core']:[];ids.forEach(id=>world.querySelector(`[data-file="${id}"]`)?.classList.add('active'));setTimeout(()=>{$('#process').textContent='idle';$('#process').className='good';$('#outputText').textContent=`$ ${command}\n\nPrototype command preview complete.\nThe map highlighted the affected scope.\n\nExact command retained above for terminal execution.`},900)}
treeList.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.folder){openFolders.has(b.dataset.folder)?openFolders.delete(b.dataset.folder):openFolders.add(b.dataset.folder);renderTree()}if(b.dataset.file)selectFile(b.dataset.file,true)};world.onclick=e=>{const b=e.target.closest('[data-file]');if(b)selectFile(b.dataset.file)};
viewport.onpointerdown=e=>{if(e.target!==viewport&&e.target!==world)return;drag={x:e.clientX,y:e.clientY,cx:camera.x,cy:camera.y,moved:false};viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId)};viewport.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved||=Math.hypot(dx,dy)>4;camera.x=drag.cx+dx;camera.y=drag.cy+dy;applyCamera()};viewport.onpointerup=e=>{if(drag&&!drag.moved)closeFocus();drag=null;viewport.classList.remove('dragging')};viewport.addEventListener('wheel',e=>{e.preventDefault();setZoom(camera.z*(e.deltaY>0?.9:1.1),e.offsetX,e.offsetY)},{passive:false});
$('#treeToggle').onclick=()=>{const c=app.classList.toggle('tree-closed');$('#treeToggle').setAttribute('aria-expanded',!c)};$('#zoomIn').onclick=()=>setZoom(camera.z*1.15);$('#zoomOut').onclick=()=>setZoom(camera.z*.87);$('#zoomReset').onclick=()=>{camera={x:40,y:30,z:.86};applyCamera()};$('#focusClose').onclick=closeFocus;
$('.actions').onclick=e=>{if(!e.target.dataset.action||!selected)return;const c={test:`npm test -- ${selected.path}`,deps:`hud deps ${selected.path}`,changes:`git diff -- ${selected.path}`,open:`code ${selected.path}`};input.value=c[e.target.dataset.action];closeFocus();input.focus()};toolkit.onclick=()=>togglePicker();$('#categories').onclick=e=>{if(e.target.dataset.category){category=e.target.dataset.category;renderPicker()}};$('#pickerSearch').oninput=renderPicker;$('#pickerList').onclick=e=>{const b=e.target.closest('[data-command]');if(!b)return;input.value=resolved(filtered()[+b.dataset.command][2]);togglePicker(false)};$('#terminal').onsubmit=e=>{e.preventDefault();togglePicker(false);run(input.value);input.value=''};$('#outputClose').onclick=()=>output.classList.remove('open');
window.onkeydown=e=>{if(e.key==='Escape'){if(picker.classList.contains('open'))togglePicker(false);else if(output.classList.contains('open'))output.classList.remove('open');else closeFocus()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();togglePicker()}if(e.key==='/'&&document.activeElement!==input&&!picker.classList.contains('open')){e.preventDefault();togglePicker()}};renderWorld();renderTree();renderPicker();setTimeout(()=>input.focus(),50);window.commandHudDemo={selectFile,togglePicker,closeFocus,run,getState:()=>({camera,selected:selected?.path||null})};
})();</script></body></html>
