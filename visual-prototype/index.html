<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CommandHUD — Repository Map</title>
<style>
:root{color-scheme:dark;--bg:#111313;--panel:#181b1b;--line:#3b4242;--text:#eeeae1;--muted:#91a0a0;--cyan:#78d5e1;--lime:#d4ec8e;--gold:#e1b87f;--tree:230px}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-columns:var(--tree) 1fr;grid-template-rows:44px 1fr 28px 64px;transition:grid-template-columns .18s}.app.tree-closed{--tree:0px}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:#151818;z-index:8}.icon{width:30px;height:30px;border:0;background:transparent;border-radius:4px;cursor:pointer}.icon:hover{background:#2a2f2f}.brand{font-size:13px;font-weight:750}.branch,.hint{color:var(--muted);font:11px ui-monospace,Consolas,monospace}.spacer{flex:1}
.tree{grid-row:2/4;border-right:1px solid var(--line);background:#151818;overflow:hidden;z-index:7;transition:transform .18s,visibility .18s}.app.tree-closed .tree{visibility:hidden;pointer-events:none;transform:translateX(-100%)}.tree-inner{width:230px;height:100%;display:flex;flex-direction:column}.tree-head{height:38px;padding:13px 12px;border-bottom:1px solid #2b3030;font-size:10px;font-weight:800;letter-spacing:.1em}.tree-scroll{padding:8px 6px;overflow:auto}.tree-row{width:100%;height:28px;display:flex;align-items:center;gap:7px;padding:0 8px;border:0;border-radius:4px;background:transparent;text-align:left;font-size:12px;cursor:pointer}.tree-row:hover,.tree-row.selected{background:#293030}.tree-row[data-depth="1"]{padding-left:25px}.twisty{width:10px;color:var(--muted)}.folder-dot{width:9px;height:7px;border:1px solid var(--gold)}.file-dot{width:7px;height:7px;border-radius:2px;background:var(--muted)}.changed{margin-left:auto;color:var(--gold);font:10px ui-monospace}
.viewport{grid-column:2;grid-row:2;position:relative;overflow:hidden;background:#131616;touch-action:none;cursor:grab}.viewport.dragging{cursor:grabbing}.world{position:absolute;width:1180px;height:720px;transform-origin:0 0}.world:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#fff06 1px,transparent 1px),linear-gradient(90deg,#fff06 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(circle,black,transparent 82%)}.region{position:absolute;border:1px solid #3a4242;background:#171a1acc;border-radius:10px}.region-title{position:absolute;top:10px;left:14px;color:#aeb8b5;font-size:11px;font-weight:800}.region-meta{position:absolute;top:11px;right:12px;color:#687575;font:9px ui-monospace}
.node{position:absolute;width:132px;min-height:56px;padding:9px 10px;border:1px solid #414949;border-radius:6px;background:#202424;box-shadow:0 3px 8px #0004;text-align:left;cursor:pointer}.node:hover{border-color:#728080;background:#252a2a}.node.selected{border-color:var(--cyan);box-shadow:0 0 0 2px #78d5e124}.node.active{animation:pulse 1.25s ease 2}.node-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 11px ui-monospace,Consolas,monospace}.node-kind{display:block;margin-top:7px;color:var(--muted);font-size:10px}.mark{position:absolute;right:8px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--gold)}@keyframes pulse{50%{border-color:var(--lime);box-shadow:0 0 0 5px #d4ec8e1d;background:#29302a}}
.zoom{position:absolute;right:14px;top:14px;display:flex;background:#171a1a;border:1px solid var(--line);border-radius:5px;overflow:hidden}.zoom button{width:30px;height:28px;border:0;border-right:1px solid var(--line);background:transparent;cursor:pointer}.map-help{position:absolute;right:14px;bottom:13px;padding:6px 8px;border-radius:4px;background:#111c;color:var(--muted);font-size:10px}
.focus{position:absolute;left:50%;top:50%;width:min(620px,calc(100% - 60px));max-height:calc(100% - 70px);transform:translate(-50%,-50%) scale(.97);padding:18px;border:1px solid #687474;border-radius:8px;background:#1c2020f7;box-shadow:0 18px 60px #000a;opacity:0;pointer-events:none;transition:.14s;overflow:auto}.focus.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}.focus-head{display:flex}.focus-title{margin:0;font:750 19px ui-monospace}.focus-path{margin-top:4px;color:var(--muted);font:11px ui-monospace}.focus-close{margin-left:auto;width:30px;height:30px;border:1px solid var(--line);border-radius:4px;background:transparent;cursor:pointer}.focus-summary{margin:20px 0;color:#c5cdca;font-size:13px;line-height:1.55}.focus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fact{padding:10px;border:1px solid #343b3b;border-radius:5px;background:#171a1a}.fact-label{color:var(--muted);font-size:9px;text-transform:uppercase}.fact-value{margin-top:5px;font:700 12px ui-monospace}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.soft{height:32px;padding:0 11px;border:1px solid #4c5757;border-radius:4px;background:#252a2a;font-size:11px;cursor:pointer}
.media-preview{display:none;margin:16px 0;padding:10px;border:1px solid #343b3b;border-radius:6px;background:#101212}.media-preview.open{display:block}.media-preview video,.media-preview img{display:block;width:100%;max-height:42vh;object-fit:contain;background:#090a0a;border-radius:4px}.media-preview audio{display:block;width:100%}.media-note{margin:8px 2px 0;color:var(--muted);font-size:10px;line-height:1.4}
.status{grid-column:2;grid-row:3;display:flex;align-items:center;gap:16px;padding:0 12px;border-top:1px solid var(--line);background:#171a1a;color:var(--muted);font:10px ui-monospace}.status strong{color:var(--text)}.good{color:var(--lime)!important}.warn{color:var(--gold)!important}.terminal{grid-column:1/-1;grid-row:4;position:relative;display:flex;align-items:center;gap:9px;padding:10px 12px;border-top:1px solid var(--line);background:#101212;z-index:10}.prompt{color:var(--lime);font:800 14px ui-monospace}.terminal>input{min-width:0;flex:1;height:38px;padding:0 10px;border:1px solid #3d4646;border-radius:4px;outline:0;background:#171a1a;color:var(--text);font:13px ui-monospace}.run,.toolkit-button,.input-mode{height:38px;padding:0 14px;border:1px solid #596464;border-radius:4px;background:#252b2b;cursor:pointer;font-size:11px}.toolkit-button[aria-expanded=true]{border-color:var(--cyan)}.input-mode,.search-scope{display:none}.terminal.search-mode .input-mode,.terminal.search-mode .search-scope{display:block}.terminal.search-mode .input-mode{border-color:var(--lime);color:var(--lime)}.search-scope{height:38px;max-width:220px;padding:0 30px 0 10px;border:1px solid #596464;border-radius:4px;background:#1b2020;color:var(--text);font:11px ui-monospace}.terminal.search-mode>input{border-color:#59694b}
.picker{position:absolute;left:12px;bottom:58px;width:min(520px,calc(100vw - 24px));height:0;display:grid;grid-template-columns:155px 1fr;border:1px solid #566262;border-radius:7px;background:#1b1f1f;box-shadow:0 16px 48px #000b;opacity:0;overflow:hidden;pointer-events:none;transition:height .18s,opacity .14s}.picker.open{height:310px;opacity:1;pointer-events:auto}.categories{padding:8px;border-right:1px solid var(--line)}.category{width:100%;height:34px;padding:0 10px;border:0;border-radius:4px;background:transparent;text-align:left;font-size:12px;cursor:pointer}.category:hover,.category.selected{background:#303636}.picker-main{display:flex;min-width:0;flex-direction:column}.picker-search{margin:10px;height:34px;padding:0 10px;border:1px solid #3d4646;border-radius:4px;background:#131616;color:var(--text);outline:0}.picker-list{padding:0 8px 8px;overflow:auto}.command-item{width:100%;display:grid;grid-template-columns:1fr auto;gap:6px;padding:9px 10px;border:0;border-radius:5px;background:transparent;text-align:left;cursor:pointer}.command-item:hover{background:#2a3030}.command-name{font-size:12px;font-weight:700}.command-desc{grid-column:1;color:var(--muted);font-size:10px}.command-code{grid-column:1/-1;color:#b8c6c3;font:10px ui-monospace}.scope{padding:2px 5px;border-radius:3px;background:#343b3b;color:var(--muted);font-size:9px}
.output{position:absolute;right:12px;bottom:58px;width:min(600px,calc(100vw - 24px));max-height:360px;border:1px solid #505b5b;border-radius:7px;background:#171a1af5;box-shadow:0 15px 45px #000b;overflow:auto;opacity:0;transform:translateY(8px);pointer-events:none;transition:.14s}.output.open{opacity:1;transform:none;pointer-events:auto}.output-head{position:sticky;top:0;height:34px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--line);background:#171a1a;z-index:1;font-size:11px}.output-head button{margin-left:auto;border:0;background:transparent;cursor:pointer}.output pre{margin:0;padding:12px;color:#c7d2cf;font:11px/1.55 ui-monospace;white-space:pre-wrap}.output-results{padding:0 8px 8px}.output-result{width:100%;display:grid;grid-template-columns:1fr auto;gap:3px 8px;padding:8px;border:0;border-radius:4px;background:transparent;color:var(--text);text-align:left;cursor:pointer}.output-result:hover{background:#293030}.output-result span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:11px ui-monospace}.output-result strong{color:var(--lime);font:11px ui-monospace}.output-result small{grid-column:1/-1;color:var(--muted);font:9px ui-monospace}
@media(max-width:640px){:root{--tree:min(82vw,300px)}.app{grid-template-rows:44px 1fr 28px 58px}.tree-inner{width:min(82vw,300px)}header .branch,header .hint{display:none}.status{gap:10px;overflow:hidden;white-space:nowrap}.status span:first-child,.status span:last-child{display:none}.terminal{padding:8px;gap:6px}.toolkit-button,.run{padding:0 10px}.focus{width:calc(100% - 20px);max-height:calc(100% - 30px)}.focus-grid{grid-template-columns:1fr}.picker{left:8px;bottom:54px;width:calc(100vw - 16px);grid-template-columns:120px 1fr}.output{right:8px;bottom:54px;width:calc(100vw - 16px)}}
</style><style>
.tree-row.search-match{color:var(--lime)}.tree-row.search-match .file-dot{background:var(--lime)}.match-count{margin-left:auto;color:var(--lime);font:10px ui-monospace}.node.search-match{border-color:var(--lime);background:#252b24;box-shadow:inset 3px 0 var(--lime)}.search-text{color:var(--lime)!important}.search-fact{border-color:#526044}.source-preview{display:none;margin:16px 0;border:1px solid #343b3b;border-radius:6px;background:#101212;overflow:hidden}.source-preview.open{display:block}.source-head{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #343b3b;color:var(--muted);font:10px ui-monospace}.source-head strong{color:var(--lime)}.source-navigation{margin-left:auto;display:flex;align-items:center;gap:7px}.source-nav{width:25px;height:23px;border:1px solid #465050;border-radius:3px;background:#202525;color:var(--text);cursor:pointer}.source-nav:disabled{opacity:.3;cursor:default}.source-code{max-height:38vh;overflow:auto;padding:8px 0;font:11px/1.55 ui-monospace,Consolas,monospace}.source-line{display:grid;grid-template-columns:48px 1fr;padding:0 10px;white-space:pre}.source-line.match{background:#d4ec8e14;color:#eef6d5}.source-number{color:#667271;text-align:right;padding-right:12px;user-select:none}.source-separator{height:1px;margin:7px 10px;background:#343b3b}
</style><style>@media(max-width:640px){.terminal.search-mode .toolkit-button{display:none}.terminal.search-mode .input-mode{padding:0 8px}.terminal.search-mode .search-scope{max-width:104px}}</style></head><body><main class="app" id="app">
<header><button class="icon" id="treeToggle" aria-label="Toggle file tree" aria-expanded="true">☰</button><span class="brand">digital-breakdown-apk</span><span class="branch">agent/playground-physical-traversal</span><span class="spacer"></span><span class="hint">Map view · drag to move · wheel to zoom</span><button class="icon" id="refreshState" aria-label="Refresh repository state">↻</button></header>
<aside class="tree"><div class="tree-inner"><div class="tree-head">EXPLORER</div><div class="tree-scroll" id="treeList"></div></div></aside>
<section class="viewport" id="viewport" aria-label="Repository map"><div class="world" id="world"></div><div class="zoom"><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomReset" aria-label="Reset map view">⌂</button><button id="zoomIn" aria-label="Zoom in">+</button></div><div class="map-help">Drag to move · wheel to zoom · select a file to focus</div>
<article class="focus" id="focusPanel" aria-hidden="true"><div class="focus-head"><div><h2 class="focus-title" id="focusTitle"></h2><div class="focus-path" id="focusPath"></div></div><button class="focus-close" id="focusClose" aria-label="Collapse focused file">×</button></div><p class="focus-summary" id="focusSummary"></p><div class="media-preview" id="mediaPreview"></div><div class="source-preview" id="sourcePreview"></div><div class="focus-grid" id="focusFacts"></div><div class="actions"><button class="soft" data-action="changes">Show Git changes</button><button class="soft" data-action="open">Prepare editor command</button></div></article></section>
<div class="status"><span>branch <strong id="branchValue">unknown</strong></span><span>selection <strong id="selection">repository</strong></span><span>files <strong id="fileCount">unknown</strong></span><span>changes <strong id="changeCount">unknown</strong></span><span>search <strong id="searchState">none</strong></span><span>snapshot <strong id="snapshotState">missing</strong></span></div>
<form class="terminal" id="terminal"><button type="button" class="toolkit-button" id="toolkitButton" aria-expanded="false">▦ Toolkit</button><button type="button" class="input-mode" id="inputMode" aria-label="Exit Search mode">Search ×</button><span class="prompt">$</span><input id="commandInput" aria-label="Terminal command" autocomplete="off" placeholder="Enter or discover an exact command"><select class="search-scope" id="searchScope" aria-label="Search scope"></select><button class="run">Copy</button>
<section class="picker" id="picker"><nav class="categories" id="categories"></nav><div class="picker-main"><input class="picker-search" id="pickerSearch" aria-label="Search toolkit" placeholder="Find an action…"><div class="picker-list" id="pickerList"></div></div></section>
<section class="output" id="output"><div class="output-head"><span id="outputTitle">Command output</span><button type="button" id="outputClose" aria-label="Close command output">×</button></div><pre id="outputText"></pre><div class="output-results" id="outputResults"></div></section></form></main>
<script src="./hud-state.js"></script><script src="./app.js"></script></body></html>
